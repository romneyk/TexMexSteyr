<!DOCTYPE html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TexMex Steyr - Restaurant & Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              texmex: {
                red: '#D32F2F', // Deeper, blood red
                redDark: '#B71C1C',
                orange: '#FB8C00', // Gold/Amber for Tequila vibes
                black: '#0a0a0a', // Rich black
                dark: '#171717', // Dark gray
                card: '#1F1F1F', // Slightly lighter for cards
                text: '#E0E0E0', // Off-white for text
              }
            },
            fontFamily: {
              sans: ['Helvetica Neue', 'Arial', 'sans-serif'],
              display: ['Impact', 'Arial Black', 'sans-serif'], // For headers
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            },
            animation: {
              'ken-burns': 'kenBurns 20s infinite alternate',
              'fade-in': 'fadeIn 1s ease-out',
              'float-slow': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              kenBurns: {
                '0%': { transform: 'scale(1.0)' },
                '100%': { transform: 'scale(1.15)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0a0a;
        color: #e0e0e0;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      .text-shadow {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      }
      .text-shadow-strong {
        text-shadow: 3px 3px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-texmex-black text-texmex-text antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
